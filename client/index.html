<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#183B4A" />
    <title>LifeAdmin</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lifeadmin_theme');
          var theme = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'light';
          var root = document.documentElement;
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var metaColorScheme = document.querySelector('meta[name="color-scheme"]');
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
            if (metaColorScheme) metaColorScheme.setAttribute('content', theme === 'system' ? 'light dark' : 'dark');
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
            if (metaColorScheme) metaColorScheme.setAttribute('content', theme === 'system' ? 'light dark' : 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
